<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17231e"><meta name="description" content="RepVault strength workout tracker"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png" type="image/png"><title>RepVault</title><style>

isplay:flex;justify-content:space-around;width:min(850px,100%)}nav button{border:0;background:none;color:#94a5be;padding:7px;font-size:12px;min-width:65px}nav button.active{color:#6ce3b5;font-weight:800}.hidden{display:none!important}.setrow{display:grid;grid-template-columns:38px 1fr 1fr 45px;gap:8px;align-items:center;margin:8px 0}.setrow input{width:100%;min-width:0;background:#0d1626;border:1px solid #3a4b61;border-radius:9px;padding:10px;color:white}.setrow .done{accent-color:#64ddb0;width:20px;height:20px}.notice{background:#233244;border-radius:10px;padding:12px;font-size:13px;color:#c8d7e9}.chart{display:flex;align-items:end;gap:7px;height:120px;padding-top:10px}.bar{flex:1;min-width:9px;background:linear-gradient(#6ce3b5,#277f77);border-radius:5px 5px 0 0}.empty{padding:28px;text-align:center;color:#aab9cb}.template-item{padding:13px 0;border-bottom:1px solid #304059}.template-item:last-child{border:0}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
